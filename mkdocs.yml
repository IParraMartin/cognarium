site_name: cognarium
site_description: Run cognitive science experiments on language models and other learners.
repo_url: https://github.com/IParraMartin/cognarium
docs_dir: docs
exclude_docs: |
  superpowers/
theme:
  name: material
  font: false
  logo: assets/brain.png
  favicon: assets/favicon.png
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            members_order: source
            show_root_heading: true
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/theme.js
  - javascripts/hero.js
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - Home: index.md
  - Get started:
      - Install: install.md
      - Quickstart: quickstart.md
      - Concepts: concepts.md
  - Paradigms:
      - Learning and transmission: paradigms/learning.md
  - User guide:
      - Custom paradigms: custom-paradigms.md
      - Recording: recording.md
      - Metrics: metrics.md
      - Data: data.md
      - Reproducibility: reproducibility.md
  - API reference: api.md
