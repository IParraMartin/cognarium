[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognarium"
dynamic = ["version"]
description = "Run cognitive science experiments on language models and other learners."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "cognitive science",
    "language models",
    "psycholinguistics",
    "interpretability",
    "experiments"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
    "huggingface_hub",
    "numpy",
    "pandas",
    "pooch>=1.9.0",
    "pyarrow",
    "python-calamine>=0.9.1",
    "safetensors",
    "torch>=2.9",
    "torchmetrics>=1.9.0",
    "tqdm",
    "transformers>=5"
]

[project.urls]
Source = "https://github.com/IParraMartin/cognarium"
Documentation = "https://github.com/IParraMartin/cognarium/tree/main/docs"
Issues = "https://github.com/IParraMartin/cognarium/issues"

[project.optional-dependencies]
dev = [
    "dit",
    "pytest",
    "rsatoolbox",
    "ruff",
    "scikit-learn",
    "scipy"
]
docs = [
    "mkdocs-material>=9.8.1",
    "mkdocstrings[python]>=1.0.8"
]
all = []

[tool.hatch.version]
path = "src/cognarium/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cognarium"]

# only the files the repository tracks, so local working files never ship
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs/*.md",
    "/docs/assets",
    "/docs/paradigms",
    "/docs/stylesheets",
    "/mkdocs.yml",
    "/README.md",
    "/LICENSE",
    "/uv.lock"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "mps: needs Apple Metal acceleration",
    "cuda: needs a CUDA device",
    "network: downloads the real datasets, run with -m network"
]

[tool.ruff.lint]
select = ["F401", "F841", "F811", "I002", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"examples/*" = ["D"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "google"
